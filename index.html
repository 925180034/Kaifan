<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="晚餐决策助手,每天 30 秒决定今晚自己做、点外卖还是出去吃。"
    />
    <meta name="theme-color" content="#F6F3EE" />
    <title>晚餐决策助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" id="app">
      <header class="top-bar">
        <div class="date-weather" aria-label="今日天气">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" />
            <path d="M8 19v1" />
            <path d="M8 14v1" />
            <path d="M16 19v1" />
            <path d="M16 14v1" />
            <path d="M12 21v1" />
            <path d="M12 16v1" />
          </svg>
          <span id="dateText">7月6日 周一 · 小雨 18°C</span>
        </div>
        <button class="icon-button" id="settingsButton" type="button" aria-label="打开设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </header>

      <span class="sr-only" id="profileSummary">2 人 · 微辣 · ¥30-60/人</span>

      <section class="mood-control" aria-label="今日状态">
        <button type="button" data-mood="lazy">偷懒</button>
        <button type="button" data-mood="normal">正常</button>
        <button type="button" data-mood="treat">想吃好点</button>
      </section>

      <p class="generation-status sr-only" id="generationStatus" data-state="ready">当前为本地方案</p>
      <button class="sr-only" id="regenerateButton" type="button">按画像生成</button>

      <div class="screen-stack" id="mainContent">
        <section class="top-panel" id="topRecommendation" aria-live="polite"></section>
        <section class="decision-list" id="decisionList" aria-label="今晚方案"></section>
      </div>

      <footer class="today-footer">
        <button class="refresh-button" id="refreshAllButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M3 21v-5h5" />
          </svg>
          全部换一批
        </button>
        <button class="recent-button" id="historyButton" type="button">最近吃过：还没有记录</button>
      </footer>
    </main>

    <aside class="sheet" id="recipeSheet" aria-hidden="true">
      <div class="sheet-panel">
        <button class="sheet-close" type="button" data-close="recipeSheet">关闭</button>
        <div id="recipeContent"></div>
      </div>
    </aside>

    <aside class="sheet" id="shoppingSheet" aria-hidden="true">
      <div class="sheet-panel">
        <button class="sheet-close" type="button" data-close="shoppingSheet">关闭</button>
        <div id="shoppingContent"></div>
      </div>
    </aside>

    <aside class="sheet" id="actionSheet" aria-hidden="true">
      <div class="sheet-panel">
        <button class="sheet-close" type="button" data-close="actionSheet">关闭</button>
        <div id="actionContent"></div>
      </div>
    </aside>

    <aside class="sheet" id="feedbackSheet" aria-hidden="true">
      <div class="sheet-panel compact">
        <button class="sheet-close" type="button" data-close="feedbackSheet">关闭</button>
        <h2>这顿怎么样?</h2>
        <div class="tag-grid" id="feedbackTags"></div>
      </div>
    </aside>

    <aside class="sheet" id="historySheet" aria-hidden="true">
      <div class="sheet-panel">
        <button class="sheet-close" type="button" data-close="historySheet">关闭</button>
        <div id="historyContent"></div>
      </div>
    </aside>

    <aside class="sheet" id="settingsSheet" aria-hidden="true">
      <div class="sheet-panel">
        <button class="sheet-close" type="button" data-close="settingsSheet">关闭</button>
        <h2>偏好设置</h2>
        <form class="settings-form" id="settingsForm">
          <label>
            用餐人数
            <select name="peopleCount">
              <option value="1">1 人</option>
              <option value="2">2 人</option>
              <option value="3-4">3-4 人</option>
              <option value="5+">5 人以上</option>
            </select>
          </label>
          <label>
            辣度
            <select name="spicyLevel">
              <option value="none">不吃辣</option>
              <option value="mild">微辣</option>
              <option value="medium">中辣</option>
              <option value="hot">重辣</option>
            </select>
          </label>
          <label>
            每人预算
            <select name="budgetPerPerson">
              <option value="under_15">¥15 以下</option>
              <option value="15_30">¥15-30</option>
              <option value="30_60">¥30-60</option>
              <option value="60_plus">¥60+</option>
            </select>
          </label>
          <label>
            做饭意愿
            <select name="cookingWillingness">
              <option value="low">尽量省事</option>
              <option value="normal">正常做饭</option>
              <option value="high">愿意复杂一点</option>
            </select>
          </label>
          <label>
            营养目标
            <input name="nutritionGoal" type="text" placeholder="高蛋白控油" />
          </label>
          <label>
            口味标签
            <textarea name="tasteTags" rows="2" placeholder="清淡、微辣、少油"></textarea>
          </label>
          <label>
            喜欢的菜系
            <textarea name="cuisinePreferences" rows="2" placeholder="家常、川湘、江浙"></textarea>
          </label>
          <label>
            喜欢的食材
            <textarea name="favoriteIngredients" rows="2" placeholder="虾仁、豆腐、番茄"></textarea>
          </label>
          <label>
            不喜欢/忌口
            <textarea name="dislikes" rows="2" placeholder="香菜、内脏"></textarea>
          </label>
          <label>
            过敏食材
            <textarea name="allergies" rows="2" placeholder="花生、乳制品"></textarea>
          </label>
          <button class="primary-button" type="submit">保存设置</button>
        </form>
      </div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
